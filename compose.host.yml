# host networking 版本：Linux，或已在 Docker Desktop 開啟 host networking 的 Mac / Windows。
#   docker compose -f compose.host.yml up -d
# 容器直接使用主機網路，不經過 Docker Desktop 的 UDP 轉發；HTTP 仍只綁 127.0.0.1。
name: tello-gcs-host

services:
  gcs:
    build: .
    image: tello-gcs:latest
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 15s
    restart: "no"
    network_mode: host
    environment:
      TELLO_IP: ${TELLO_IP:-192.168.10.1}
      HTTP_HOST: 127.0.0.1
      PUBLIC_PORT: "8080"
